# Confere cada envio antes que ele chegue ao ar.
#
# A publicacao em si nao acontece aqui: o servidor busca a main sozinho a cada
# minuto (deploy/publicacao/). Esta verificacao e o aviso para quem enviou —
# o servidor recusa o commit com erro de sintaxe ou com migracao que falha.
name: Verificar

on:
  push:
  pull_request:

jobs:
  sintaxe:
    name: Sintaxe PHP
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: php -l em todos os arquivos
        run: |
          php -v | head -1
          falhas=0
          while IFS= read -r -d '' arquivo; do
            if ! saida=$(php -l "$arquivo" 2>&1); then
              echo "::error file=$arquivo::$(echo "$saida" | grep -v '^Errors parsing' | head -1)"
              falhas=$((falhas + 1))
            fi
          done < <(git ls-files -z '*.php' ':!mobile_capacitor/android/**')
          if [ "$falhas" -gt 0 ]; then
            echo "$falhas arquivo(s) com erro. O servidor NAO vai publicar este commit."
            exit 1
          fi
          echo "Sintaxe ok."

  migracoes:
    name: Migrações do banco
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: teste
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -uroot -pteste"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Schema + todas as migrações, duas vezes
        env:
          MYSQL_OPCOES: -h127.0.0.1 -uroot -pteste
        run: tools/testar_migracoes.sh --apagar-banco-de-teste

  autoria:
    name: Autoria dos commits
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sem linhas de co-autoria
        run: |
          achados=$(git log -i --grep='^co-authored-by:' --format='%h %an — %s' HEAD)
          if [ -n "$achados" ]; then
            echo "::error::Commits com linha Co-Authored-By (ver CONTRIBUTING.md):"
            echo "$achados"
            exit 1
          fi
          echo "Ok."
