<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Festival Jurados</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7fb;
      color: #17389d;
    }

    .card {
      width: min(92vw, 560px);
      background: #fff;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 18px 42px rgba(23, 56, 157, 0.14);
    }

    h1 {
      margin: 0 0 12px;
    }

    p {
      margin: 0;
      color: #5d6580;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <section class="card">
    <h1>Festival Jurados</h1>
    <p>Este wrapper Android foi configurado para abrir a versao PWA publicada do sistema.</p>
  </section>
</body>
</html>
